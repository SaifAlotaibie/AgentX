<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiwa Agent - WebSocket Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: ltr;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin-bottom: 10px;
        }
        
        .connection-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .connection-status.connected {
            background: #10b981;
        }
        
        .connection-status.disconnected {
            background: #ef4444;
        }
        
        .config {
            padding: 20px;
            background: #f3f4f6;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .config-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .config-row button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .config-row button:hover {
            background: #5568d3;
        }
        
        .config-row button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.user {
            background: #dbeafe;
            margin-left: auto;
            text-align: right;
        }
        
        .message.assistant {
            background: #e0e7ff;
        }
        
        .message.system {
            background: #fef3c7;
            text-align: center;
            max-width: 100%;
            font-style: italic;
        }
        
        .message .role {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            color: #6b7280;
        }
        
        .checklist {
            padding: 20px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
        }
        
        .checklist h3 {
            margin-bottom: 15px;
            color: #374151;
        }
        
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #f3f4f6;
            border-radius: 5px;
        }
        
        .checklist-item .status {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .checklist-item .status.pending {
            background: #e5e7eb;
            color: #6b7280;
        }
        
        .checklist-item .status.in_progress {
            background: #fbbf24;
            color: white;
        }
        
        .checklist-item .status.done {
            background: #10b981;
            color: white;
        }
        
        .checklist-item .status.failed {
            background: #ef4444;
            color: white;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        .input-row input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .input-row button {
            padding: 12px 25px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .input-row button:hover {
            background: #059669;
        }
        
        .input-row button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .quick-messages {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .quick-messages button {
            padding: 8px 12px;
            background: #e0e7ff;
            color: #4338ca;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .quick-messages button:hover {
            background: #c7d2fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Qiwa Agent Test Client</h1>
            <span id="statusBadge" class="connection-status disconnected">Disconnected</span>
        </div>
        
        <div class="config">
            <div class="config-row">
                <input type="text" id="sessionId" placeholder="Session ID" value="S123">
                <input type="text" id="userId" placeholder="User ID" value="U123">
                <input type="text" id="userRole" placeholder="User Role" value="employee">
                <input type="text" id="serverUrl" placeholder="Server URL" value="ws://localhost:8000">
            </div>
            <div class="config-row">
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                <button onclick="clearChat()">Clear Chat</button>
            </div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="checklist" id="checklistArea" style="display: none;">
            <h3>Process Checklist</h3>
            <div id="checklistSteps"></div>
        </div>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
            </div>
            <div class="quick-messages">
                <button onclick="sendQuickMessage('I want to add my resume')">Add Resume (EN)</button>
                <button onclick="sendQuickMessage('أريد إضافة سيرتي الذاتية')">Add Resume (AR)</button>
                <button onclick="sendQuickMessage('What is Qiwa?')">What is Qiwa? (EN)</button>
                <button onclick="sendQuickMessage('ما هي منصة قوى؟')">What is Qiwa? (AR)</button>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let sessionId = '';
        
        function addMessage(role, message) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const roleSpan = document.createElement('div');
            roleSpan.className = 'role';
            roleSpan.textContent = role;
            
            const contentDiv = document.createElement('div');
            contentDiv.textContent = message;
            
            messageDiv.appendChild(roleSpan);
            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function updateChecklist(steps) {
            const checklistArea = document.getElementById('checklistArea');
            const checklistSteps = document.getElementById('checklistSteps');
            
            if (steps && steps.length > 0) {
                checklistArea.style.display = 'block';
                checklistSteps.innerHTML = '';
                
                steps.forEach(step => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'checklist-item';
                    
                    const statusSpan = document.createElement('div');
                    statusSpan.className = `status ${step.status}`;
                    statusSpan.textContent = step.status === 'done' ? '✓' : step.status === 'in_progress' ? '⟳' : '○';
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = step.title;
                    
                    itemDiv.appendChild(statusSpan);
                    itemDiv.appendChild(titleSpan);
                    checklistSteps.appendChild(itemDiv);
                });
            }
        }
        
        function connect() {
            sessionId = document.getElementById('sessionId').value;
            const userId = document.getElementById('userId').value;
            const userRole = document.getElementById('userRole').value;
            const serverUrl = document.getElementById('serverUrl').value;
            
            const wsUrl = `${serverUrl}/ws/${sessionId}/${userId}/${userRole}`;
            
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('Connected');
                document.getElementById('statusBadge').textContent = 'Connected';
                document.getElementById('statusBadge').className = 'connection-status connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                addMessage('system', 'Connected to Qiwa Agent');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);
                
                if (data.type === 'chat_message') {
                    addMessage(data.role, data.message);
                }
                else if (data.type === 'process_update') {
                    updateChecklist(data.steps);
                }
                else if (data.type === 'ticket_update') {
                    addMessage('system', `Ticket ${data.ticket.ticketId} ${data.ticket.status}`);
                }
                else if (data.type === 'final_response') {
                    addMessage('system', `Final: ${data.message} (${data.status})`);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('system', 'Connection error');
            };
            
            ws.onclose = () => {
                console.log('Disconnected');
                document.getElementById('statusBadge').textContent = 'Disconnected';
                document.getElementById('statusBadge').className = 'connection-status disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                addMessage('system', 'Disconnected from Qiwa Agent');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !ws) return;
            
            const data = {
                type: 'user_message',
                message: message,
                sessionId: sessionId,
                userId: document.getElementById('userId').value,
                userRole: document.getElementById('userRole').value
            };
            
            console.log('Sending:', data);
            ws.send(JSON.stringify(data));
            
            input.value = '';
        }
        
        function sendQuickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function clearChat() {
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('checklistArea').style.display = 'none';
        }
    </script>
</body>
</html>
